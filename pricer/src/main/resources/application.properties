# REST price endpoint (spec 006). Local use only: bind to the loopback interface.
server.address=127.0.0.1
server.port=8080
# Folder holding <city>.parquet; relative paths resolve against the working directory
# (bootRun runs from the repo root). Override with --pricer.data-dir=...
pricer.data-dir=data/pricer
# Errors outside Spring MVC (e.g. a malformed URL rejected by Tomcat) fall back to Boot's /error
# body; never include internals in it.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
